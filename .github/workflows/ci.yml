name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (python + sql + yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: sqlfluff lint
        run: sqlfluff lint dbt_stocks/models dbt_stocks/tests --dialect snowflake
      - name: yamllint
        run: yamllint -c .yamllint.yml .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dev.txt
      - name: pytest
        run: pytest tests/unit --cov=producer --cov-report=term-missing --cov-fail-under=80
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  dag-validation:
    name: Airflow DAG import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Airflow with constraints
        run: |
          AIRFLOW_VERSION=2.9.3
          CONSTRAINT="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${{ env.PYTHON_VERSION }}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" "apache-airflow-providers-snowflake" --constraint "${CONSTRAINT}"
          pip install pytest
      - name: Import every DAG and assert no cycles
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
        run: |
          airflow db migrate
          pytest tests/dags -v

  dbt-parse:
    name: dbt parse (no warehouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dbt.txt
      - name: dbt deps
        working-directory: dbt_stocks
        run: dbt deps
      - name: dbt parse
        working-directory: dbt_stocks
        # parse resolves refs, sources, macros and jinja without connecting.
        env:
          SNOWFLAKE_ACCOUNT: parse-only
          SNOWFLAKE_USER: parse-only
          SNOWFLAKE_PRIVATE_KEY: parse-only
          DBT_TARGET: ci
          DBT_SCHEMA: CI_PARSE
        run: dbt parse --profiles-dir . --target ci

  dbt-slim-ci:
    name: dbt build (changed models only)
    runs-on: ubuntu-latest
    needs: [lint, dbt-parse]
    # Skipped automatically on forks, where the Snowflake secrets are absent.
    if: github.event_name == 'pull_request'
    environment: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dbt.txt

      - name: Guard on missing credentials
        id: guard
        run: |
          if [ -z "${{ secrets.SNOWFLAKE_ACCOUNT }}" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Snowflake secrets not configured; skipping warehouse build."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download production manifest for state comparison
        if: steps.guard.outputs.has_creds == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: prod-manifest
          path: prod-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ vars.LAST_PROD_RUN_ID }}

      - name: dbt build (state:modified+)
        if: steps.guard.outputs.has_creds == 'true'
        working-directory: dbt_stocks
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: STOCKS_MDS_CI
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          DBT_TARGET: ci
          DBT_SCHEMA: CI_PR_${{ github.event.pull_request.number }}
        run: |
          dbt deps
          if [ -f ../prod-artifacts/manifest.json ]; then
            mkdir -p state && cp ../prod-artifacts/manifest.json state/
            dbt build --profiles-dir . --target ci --select state:modified+ --state ./state --defer
          else
            echo "::notice::No prod manifest available; building everything."
            dbt build --profiles-dir . --target ci
          fi

      - name: Drop the pull request schema
        if: always() && steps.guard.outputs.has_creds == 'true'
        working-directory: dbt_stocks
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: STOCKS_MDS_CI
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          DBT_TARGET: ci
          DBT_SCHEMA: CI_PR_${{ github.event.pull_request.number }}
        run: |
          dbt run-operation drop_pr_schemas --profiles-dir . --target ci || true

  security:
    name: Secret and dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements/producer.txt --strict || true

  docker-build:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [producer, airflow, connect]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render config with placeholder env
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "compose file is valid"
