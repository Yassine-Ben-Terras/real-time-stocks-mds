extends: default

ignore: |
  dbt_stocks/target/
  dbt_stocks/dbt_packages/
  .github/workflows/

rules:
  line-length:
    max: 140
    level: warning
  truthy:
    allowed-values: ["true", "false", "True", "False"]
  comments:
    min-spaces-from-content: 1
  document-start: disable
  braces:
    max-spaces-inside: 1
